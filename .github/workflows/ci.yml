name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly strict link check (Mondays 06:00 UTC).
    - cron: '0 6 * * 1'

# Minimum permissions for the whole workflow; jobs may broaden as needed.
# See docs/security-baseline.md for the rationale.
permissions:
  contents: read

jobs:
  docs-check:
    name: Structural docs check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate required files exist
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f AGENTS.md

      - name: Basic repository health
        run: |
          test -d docs
          test -d .ai

  conformance:
    name: Self-conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repository states rules; this asserts it keeps them. Each check
      # exists because the rule was already written down and broken anyway —
      # see .ai/errors.md.
      - name: Repository follows its own rules
        run: bash .github/scripts/check-conformance.sh

  language-check:
    name: German language check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Vocabulary and form of address only. A review found the German text had
      # been built from English sentence logic; these two are the parts a script
      # can catch. See docs/language-style.md.
      - name: Check German content vocabulary and address
        run: node site/scripts/check-language.mjs

  site-build:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `npm ci` and the build run third-party code; keep GITHUB_TOKEN out
          # of .git/config, same reasoning as the Pages build job.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Type check
        working-directory: site
        run: npm run check

      # Build only — the deploy stays in pages.yml, gated on `main`. Without
      # this job a broken build is green on the PR and surfaces in the deploy
      # afterwards; that is how PR #75 (Astro 7) reached `main`.
      # No fetch-depth: 0: the sitemap's git-derived lastmod needs full history,
      # but this job discards its output and only has to prove the build runs.
      - name: Build
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !site/node_modules
            !site/dist
            !site/.astro
            !.ai

  link-check:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docs/security-baseline.md teaches SHA-pinning using this workflow's own
      # lychee pin as the example. Dependabot bumps workflows but never parses
      # markdown, so the example silently went stale once already and shipped a
      # SHA that does not resolve. Fail here instead.
      - name: Pinning example matches the pin CI runs
        run: |
          pin=$(grep -o 'lycheeverse/lychee-action@[0-9a-f]\{40\}' .github/workflows/ci.yml | head -1)
          grep -q "$pin" docs/security-baseline.md || {
            echo "::error file=docs/security-baseline.md::Example pin differs from $pin in ci.yml"
            exit 1
          }

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Strict on the weekly cron; advisory on PRs and pushes (external
          # 4xx/5xx flakes are common and shouldn't block reviews).
          fail: ${{ github.event_name == 'schedule' }}
          args: >-
            --cache
            --max-cache-age 7d
            --no-progress
            --exclude-mail
            --exclude-loopback
            './**/*.md'
