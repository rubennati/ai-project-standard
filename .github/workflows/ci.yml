name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly strict link check (Mondays 06:00 UTC). Every other job below is
    # skipped on this trigger (see each job's `if:`) — the schedule exists for
    # exactly one property, a full-repo link sweep that fails on rot instead of
    # only reporting it, and re-running the rest weekly verifies nothing new.
    - cron: '0 6 * * 1'

# Cancel a superseded run in the same group. The scheduled run gets its own
# fixed group name so an ordinary push or PR can never cancel the weekly
# strict check — only a second overlapping weekly run could, which is safe.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'weekly-link-check' || github.ref }}
  cancel-in-progress: true

# Minimum permissions for the whole workflow; jobs may broaden as needed.
# See docs/security-baseline.md for the rationale.
permissions:
  contents: read

jobs:
  docs-check:
    name: Structural docs check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate required files exist
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f AGENTS.md

      - name: Basic repository health
        run: |
          test -d docs
          test -d .ai

  conformance:
    name: Self-conformance
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The repository states rules; this asserts it keeps them. Each check
      # exists because the rule was already written down and broken anyway —
      # see .ai/errors.md.
      - name: Repository follows its own rules
        run: bash .github/scripts/check-conformance.sh

  markdown-lint:
    name: Markdown lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !site/node_modules
            !site/dist
            !site/.astro
            !.ai

  link-check:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docs/security-baseline.md teaches SHA-pinning using this workflow's own
      # lychee pin as the example. Dependabot bumps workflows but never parses
      # markdown, so the example silently went stale once already and shipped a
      # SHA that does not resolve. Fail here instead.
      - name: Pinning example matches the pin CI runs
        run: |
          pin=$(grep -o 'lycheeverse/lychee-action@[0-9a-f]\{40\}' .github/workflows/ci.yml | head -1)
          grep -q "$pin" docs/security-baseline.md || {
            echo "::error file=docs/security-baseline.md::Example pin differs from $pin in ci.yml"
            exit 1
          }

      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Strict on the weekly cron; advisory on PRs and pushes (external
          # 4xx/5xx flakes are common and shouldn't block reviews).
          fail: ${{ github.event_name == 'schedule' }}
          args: >-
            --cache
            --max-cache-age 7d
            --no-progress
            --exclude-mail
            --exclude-loopback
            './**/*.md'
