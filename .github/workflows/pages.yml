name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow only one concurrent deployment; let in-progress runs finish so a queued
# deploy doesn't cancel a partially-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

# Deliberately empty at workflow level: an unlisted scope resolves to `none`, so
# each job below declares only what it needs. The build job runs `npm ci`, which
# executes third-party install scripts — it must not hold the deploy scopes.
permissions: {}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history: sitemap <lastmod> is the commit date of each page's
          # source file. A shallow clone reports one synthetic date for every
          # file, which would silently turn lastmod back into a build timestamp.
          fetch-depth: 0
          # Keep GITHUB_TOKEN out of .git/config. The next steps run `npm ci`
          # and a build, so third-party code would otherwise execute in a
          # workspace that carries a usable credential.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Astro 7 requires Node >= 22.12. Pin to the latest LTS major.
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build with Astro
        working-directory: site
        env:
          # Ensure absolute URLs in sitemap/canonical match the Pages deployment.
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # The deploy scopes live only here. This job checks out nothing and runs no
    # third-party code beyond the pinned deploy action itself.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
