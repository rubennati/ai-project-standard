name: Site CI

# PR-only, scoped to the site. Push to `main` is deliberately excluded:
# `pages.yml` already builds `site/` before every deploy, and `main` only
# ever changes through a merged pull request (branch protection requires one
# and allows no bypass), so any site change reaching `main` already passed
# this same build — with typecheck, which `pages.yml`'s build does not run —
# as a PR check. Building it again on push would repeat that work for no
# extra safety.
on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site-ci.yml'
      - '.github/workflows/pages.yml'

# Cancel a superseded run on the same PR/branch — safe here because neither
# job below has a side effect outside its own runner.
concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  language-check:
    name: German language check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Vocabulary and form of address only. A review found the German text had
      # been built from English sentence logic; these two are the parts a script
      # can catch. See docs/language-style.md.
      - name: Check German content vocabulary and address
        run: node site/scripts/check-language.mjs

  site-build:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `npm ci` and the build run third-party code; keep GITHUB_TOKEN out
          # of .git/config, same reasoning as the Pages build job.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Type check
        working-directory: site
        run: npm run check

      # Build only — the deploy stays in pages.yml. Without this job a broken
      # build is green on the PR and surfaces in the deploy afterwards; that
      # is how PR #75 (Astro 7) reached `main`.
      # No fetch-depth: 0: the sitemap's git-derived lastmod needs full history,
      # but this job discards its output and only has to prove the build runs.
      - name: Build
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build
