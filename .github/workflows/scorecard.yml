name: OpenSSF Scorecard

# Generates an OpenSSF Scorecard security score for the repository.
# Results are published to the OpenSSF API (used by the badge in README.md)
# and uploaded to GitHub's code-scanning tab as SARIF.
#
# Docs: https://github.com/ossf/scorecard-action

on:
  branch_protection_rule:
  schedule:
    # Weekly on Mondays at 06:30 UTC (30 minutes after the link-check cron).
    - cron: '30 6 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

# OIDC + sarif upload + read access to repo metadata.
permissions: read-all

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes results to the OpenSSF API so the badge stays current.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 7

      - name: Upload to GitHub code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v3
        with:
          sarif_file: results.sarif
