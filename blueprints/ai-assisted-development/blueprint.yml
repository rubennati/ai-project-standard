id: ai-assisted-development
title: AI-assisted development
status: draft
applies-to: existing-repo
summary: >-
  The frame an AI agent operates inside: what it decides itself, when it stops
  and asks, what it may never do, what must be verified before anything reaches
  the default branch, plus an initialisation interview it runs on first contact.
  Drops on top of an existing repository; chooses nothing about the language or
  the licence.
licence: MIT-0
placeholders: []
# What was run against a fresh copy, and when. A blueprint claiming "this is how
# you work" that has never been run is an assessment presenting itself as fact.
verified:
  date: 2026-08-09
  method: >-
    Overlaid twice onto a git repository that already had a README, source and
    a workflow — once where nothing collided, and once where the host already
    had its own AGENTS.md and .ai/. Linted under markdownlint's DEFAULT rules,
    because an overlay ships no lint config and has to pass the adopter's.
  result: >-
    Adds 23 paths and modifies nothing when there is no collision; every
    shipped reference resolves; lint clean over 25 files. One serious defect
    found and fixed.
  defects-found:
    - "The take command silently overwrote an existing AGENTS.md,
      .ai/state.md and .ai/decisions.md. decisions.md is append-only by
      design, so this destroyed the reasoning behind every past choice with
      only `git status` between the adopter and the loss. The README now
      copies beside the tree and shows what would collide before anything
      moves."
    - "The earlier verification claimed the overlay adds only its own paths.
      It was run against a host that did not have those files, so the check
      could not fail — a true statement about the wrong test."
  not-covered:
    - Whether an agent actually follows the frame over weeks rather than for
      the first few edits. That needs a real project, which is why the status
      is draft.
    - Whether the stated latitude moves behaviour in both directions —
      proceeding where the frame says proceed, and still stopping at the
      reserved decisions. A real run has to record both.
