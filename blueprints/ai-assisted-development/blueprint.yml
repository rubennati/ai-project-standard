id: ai-assisted-development
title: AI-assisted development
status: draft
applies-to: existing-repo
summary: >-
  The frame an AI agent operates inside: when it stops and asks, what it may
  never do, what must be verified before anything reaches the default branch,
  plus an initialisation interview it runs on first contact. Drops on top of an
  existing repository; chooses nothing about the language or the licence.
licence: MIT-0
placeholders: []
# What was run against a fresh copy, and when. A blueprint claiming "this is how
# you work" that has never been run is an assessment presenting itself as fact.
verified:
  date: 2026-08-09
  method: >-
    Overlaid onto a git repository that already had a README and source, then
    linted under markdownlint's DEFAULT rules — an overlay must not ship its
    own lint config, so it has to pass the adopter's.
  result: >-
    Adds only its own 23 paths and clobbers nothing; every shipped reference
    resolves; lint clean. Four defects found and fixed: three wide tables and
    the payload banner itself broke the default 80-column rule, and two files
    referenced SECURITY.md and CHANGELOG.md as though an overlay shipped them.
  not-covered:
    - Whether an agent actually follows the frame. That needs a real project,
      which is why the status is draft.
