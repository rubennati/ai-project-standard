id: open-source
title: Open source baseline
status: draft
applies-to: new-repo
summary: >-
  Governance, contribution and CI files for a public repository. The decisions
  are already made and the reasons are stated. No AI files, no application code,
  and no licence chosen for you.
licence: MIT-0
placeholders:
  - PROJECT_NAME
  - OWNER
  - REPO
  - CONTACT_EMAIL
# What was run against a fresh copy, and when. A blueprint claiming "this is how
# you work" that has never been run is an assessment presenting itself as fact.
verified:
  date: 2026-08-09
  method: >-
    Payload materialised as a project by following the README literally —
    banners stripped, placeholders filled, licence added, git initialised —
    then every gate from its own ci.yml run verbatim, each one tested both
    for passing on a clean tree and for failing on a deliberately broken one.
  result: >-
    Six gates now behave as designed, positively and negatively. Three
    defects found and fixed, two of which made the pipeline red on day one
    for every adopter who followed the instructions.
  defects-found:
    - "The licence gate could never pass. `ls LICENSE LICENSE.md LICENSE.txt`
      exits non-zero unless every operand exists, so an adopter who added a
      LICENSE still got a red build telling them to add a licence."
    - "Markdown lint failed on a correctly filled payload: the contact
      placeholder became a bare email address, which MD034 rejects."
    - "The README said to delete the first line of each file. In the two issue
      templates the banner sits below the YAML front matter, so following the
      instruction deleted the front matter and left the banner."
  not-covered:
    - Link check, because the payload carries placeholder URLs by design.
    - The GitHub settings in docs/repository-settings.md, which no local run
      can exercise.
    - Whether it works as the start of a real public project. That is what
      separates draft from stable, and it has not happened.
