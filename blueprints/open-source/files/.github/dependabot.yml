# Blueprint payload: open-source. Edit here, not in your copy. Delete this line after copying.
version: 2
updates:
  # Workflow actions are pinned to commit SHAs, so this is what keeps them
  # current. Without it, pinning means going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
